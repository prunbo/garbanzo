# Garbanzo lock screen (hyprlock)
background {
    monitor =
    path = ~/Pictures/Wallpapers/default.jpg
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(ff6b00)
    inner_color = rgb(1e1e28)
    font_color = rgb(f5f5f5)
    fade_on_empty = true
    placeholder_text = <span foreground="##8a8a9a">Password...</span>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(f5f5f5)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = rgb(8a8a9a)
    font_size = 18
    font_family = Rajdhani
    position = 0, 60
    halign = center
    valign = center
}