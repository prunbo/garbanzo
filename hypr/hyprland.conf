# Garbanzo System - Hyprland configuration
# Main entry point. Sources modular config files.

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/layer.conf

# Garbanzo layer-shell tuning (generated by quickshell setup)
source = ~/.config/quickshell/garbanzo/hyprland-layer-config.conf